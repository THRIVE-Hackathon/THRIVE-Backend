{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}THRIVE{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'trips:list' %}">THRIVE</a>
    {% if request.user.is_authenticated %}
      <nav class="nav">
        <a href="{% url 'trips:list' %}">기록</a>
        <a href="{% url 'trips:home' %}">홈</a>
        <a href="{% url 'accounts:profile' %}">프로필</a>
        <a href="{% url 'accounts:settings' %}">설정</a>
        <a href="{% url 'accounts:logout' %}">로그아웃</a>
      </nav>
    {% endif %}
  </header>

  <main class="page">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <p class="message {{ message.tags }}">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
