{% extends "base.html" %}

{% block title %}회원가입 - THRIVE{% endblock %}

{% block content %}
<section class="panel narrow">
  <h1>회원가입</h1>

  <form method="post" class="form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label class="{% if field.field.widget.input_type == 'checkbox' %}checkbox{% endif %}">
        <span>{{ field.label }}</span>
        {{ field }}
        {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
        {{ field.errors }}
      </label>
    {% endfor %}
    <button type="submit">다음</button>
  </form>

  <p class="switch-link">
    이미 계정이 있나요? <a href="{% url 'accounts:login' %}">로그인</a>
  </p>
</section>
{% endblock %}
