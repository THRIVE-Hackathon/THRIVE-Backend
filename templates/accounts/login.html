{% extends "base.html" %}

{% block title %}로그인{% endblock %}
{% block body_class %}app__body--login{% endblock %}
{% block tabbar %}{% endblock %}

{% block content %}
<section class="auth-brand" aria-labelledby="login-title">
  <div class="auth-brand__icon" aria-hidden="true">
    <span class="svg-icon svg-icon--flight"></span>
  </div>
  <h1 class="auth-brand__title" id="login-title">LANDING</h1>
  <p class="auth-brand__subtitle">장거리 비행 후, 회복의 여정을 함께 관리해요!</p>
</section>

<form method="post" class="auth-form auth-form--login auth-form--tall" data-auth="login" novalidate>
  {% csrf_token %}
  <div class="field" data-field="email"{% if form.username.errors %} data-server-error="{{ form.username.errors|striptags }}"{% endif %}>
    <label class="sr-only" for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
    {{ form.username }}
    <p class="field__msg"></p>
  </div>
  <div class="field" data-field="password"{% if form.password.errors %} data-server-error="{{ form.password.errors|striptags }}"{% endif %}>
    <label class="sr-only" for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
    {{ form.password }}
    <p class="field__msg"></p>
  </div>
  <p class="auth-form__error"{% if form.non_field_errors %} data-server-error="{{ form.non_field_errors|striptags }}"{% endif %}></p>
  <button type="submit" class="btn btn--primary btn--block">로그인</button>
</form>

<p class="auth-alt auth-alt--login">
  <a class="btn--link" href="{% url 'accounts:signup' %}">회원가입</a>
</p>
{% endblock %}
