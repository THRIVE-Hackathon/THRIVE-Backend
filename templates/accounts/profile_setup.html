{% extends "base.html" %}

{% block title %}프로필 입력 - THRIVE{% endblock %}
{% block body_class %}app__body--profile{% endblock %}
{% block tabbar %}{% endblock %}

{% block app_header %}
<header class="app-header">
  <span></span>
  <h1 class="app-header__title">회원가입</h1>
  <a class="app-header__btn app-header__btn--close" href="{% url 'accounts:logout' %}" aria-label="닫기">
    <span class="svg-icon svg-icon--close"></span>
  </a>
</header>
{% endblock %}

{% block content %}
<div class="auth-steps" aria-label="회원가입 진행 단계">
  <span class="auth-steps__dot"></span>
  <span class="auth-steps__dot is-active"></span>
</div>

<form method="post" class="auth-form auth-form--profile auth-form--tall" data-auth="profile" novalidate>
  {% csrf_token %}
  <div class="field" data-field="nickname"{% if form.nickname.errors %} data-server-error="{{ form.nickname.errors|striptags }}"{% endif %}>
    <label class="field__label" for="{{ form.nickname.id_for_label }}">닉네임</label>
    {{ form.nickname }}
    <p class="field__msg"></p>
  </div>

  <div class="field" data-field="gender"{% if form.gender.errors %} data-server-error="{{ form.gender.errors|striptags }}"{% endif %}>
    <span class="field__label">성별</span>
    <input type="hidden" name="gender" value="{{ form.gender.value|default:'' }}" data-gender-value>
    <div class="segmented" role="group" aria-label="성별">
      <button type="button" class="segmented__btn {% if form.gender.value == 'female' %}is-active{% endif %}" data-value="female" aria-pressed="{% if form.gender.value == 'female' %}true{% else %}false{% endif %}">여성</button>
      <button type="button" class="segmented__btn {% if form.gender.value == 'male' %}is-active{% endif %}" data-value="male" aria-pressed="{% if form.gender.value == 'male' %}true{% else %}false{% endif %}">남성</button>
    </div>
    <p class="field__msg"></p>
  </div>

  <div class="field" data-field="age"{% if form.age.errors %} data-server-error="{{ form.age.errors|striptags }}"{% endif %}>
    <label class="field__label" for="{{ form.age.id_for_label }}">나이</label>
    {{ form.age }}
    <p class="field__msg"></p>
  </div>

  <p class="auth-form__error"{% if form.non_field_errors %} data-server-error="{{ form.non_field_errors|striptags }}"{% endif %}></p>
  <button type="submit" class="btn btn--primary btn--block">완료</button>
</form>
{% endblock %}
