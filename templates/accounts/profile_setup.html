{% extends "base.html" %}

{% block title %}프로필 입력 - THRIVE{% endblock %}

{% block content %}
<section class="panel narrow">
  <h1>거의 다 됐어요</h1>
  <p class="muted">나이와 성별은 이후 비교 통계에만 사용합니다.</p>

  <form method="post" class="form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <fieldset>
        <legend>{{ field.label }}</legend>
        {{ field }}
        {{ field.errors }}
      </fieldset>
    {% endfor %}
    <button type="submit">시작하기</button>
  </form>
</section>
{% endblock %}
