<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THRIVE · 기준값 설문</title>
    <link rel="stylesheet" href="../../styles/reset.css" />
    <link rel="stylesheet" href="../../styles/variables.css" />
    <link rel="stylesheet" href="../../styles/common.css" />
    <link rel="stylesheet" href="../../styles/record.css" />
    <link rel="stylesheet" href="../../styles/icons.css" />
  </head>
  <body>
    <div class="app" id="app">
      <div id="header-mount"></div>
      <main class="app__body">
        <h1 class="text-title-1">기준값 설문</h1>
        <p class="text-caption text-muted">이후 회복 결과와 비교할 기준값을 수집합니다.</p>

        <section>
          <h2 class="text-heading-1">최근 장거리 비행 경험</h2>
          <div class="field">
            <label class="field__label">최근 비행 노선 (예: 서울 → 뉴욕)</label>
            <select class="field__select" required>
              <option value="" disabled selected>Select...</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label">착륙 날짜 (대략)</label>
            <select class="field__select" required>
              <option value="" disabled selected>Select...</option>
            </select>
          </div>
        </section>

        <section>
          <h2 class="text-heading-1">착륙 다음 날 컨디션 차질도</h2>
          <p class="text-caption text-muted">체감했던 정도를 떠올려 응답해주세요</p>
          <div class="field">
            <label><input type="radio" name="impact" value="0" /> 0점 — 탈진없이 다 했어요</label>
            <label><input type="radio" name="impact" value="1" /> 1점 — 거의 다 했지만 조금 피로했어요</label>
            <label><input type="radio" name="impact" value="2" /> 2점 — 절반 정도만 했어요</label>
            <label><input type="radio" name="impact" value="3" /> 3점 — 중요한 일만 겨우 했어요</label>
            <label><input type="radio" name="impact" value="4" /> 4점 — 거의 아무것도 못 했어요</label>
            <label><input type="radio" name="impact" value="5" /> 5점 — 여러 날 이상 영향을 받았어요</label>
          </div>
        </section>

        <button type="button" class="btn btn--primary btn--block" onclick="location.href='./expected-score.html'">저장하고 계속</button>
      </main>
    </div>
    <script src="../../components/header.js"></script>
    <script>
      document.getElementById("header-mount").append(
        THRIVE.createHeader({
          title: "기준값 설문",
          onClose: function () { window.location.href = "./trip-register.html"; },
        })
      );
    </script>
  </body>
</html>
