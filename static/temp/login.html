<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THRIVE · 로그인</title>
    <!-- 경로는 repo 구조(src/pages/auth/) 기준 상대경로 -->
    <link rel="stylesheet" href="../../styles/reset.css" />
    <link rel="stylesheet" href="../../styles/variables.css" />
    <link rel="stylesheet" href="../../styles/common.css" />
    <link rel="stylesheet" href="../../styles/auth.css" />
    <link rel="stylesheet" href="../../styles/icons.css" />
  </head>
  <body>
    <!-- 인증 화면(A1): 헤더/탭바 없음 (명세서 "A 인증 — 탭바 없음") -->
    <div class="app" id="app">
      <main class="app__body app__body--login">
        <!-- 브랜딩: 이륙 아이콘 + LANDING + 수집/서비스 안내(FA 화면 구성) -->
        <div class="auth-brand">
          <span class="auth-brand__icon" aria-hidden="true">
            <span class="svg-icon svg-icon--flight"></span>
          </span>
          <h1 class="auth-brand__title">LANDING</h1>
          <p class="auth-brand__subtitle">장거리 비행 후, 회복의 여정을 함께 관리해요!</p>
        </div>

        <!--
          [Django 연동 지점]
          - action        : 로그인 처리 URL (예: {% url 'auth:login' %})
          - data-demo="true": 서버 미연동 상태에서 실제 POST를 막고 검증만 확인.
                              Django 연동 시 이 속성만 제거하면 폼이 그대로 POST됨.
        -->
        <form
          class="auth-form auth-form--login auth-form--tall"
          method="post"
          action="/auth/login/"
          novalidate
          data-auth="login"
          data-demo="true"
        >
          <!-- [Django] 아래 hidden input을 {% csrf_token %} 으로 치환 -->
          <input type="hidden" name="csrfmiddlewaretoken" value="" data-csrf />

          <!-- FA101 이메일 형식 검사. -->
          <div class="field" data-field="email">
            <label class="field__label sr-only" for="login-email">이메일</label>
            <input
              class="field__input"
              id="login-email"
              name="username"
              type="email"
              placeholder="이메일"
              autocomplete="email"
              value=""
              required
            />
            <p class="field__msg"></p>
          </div>

          <!-- FA102 비밀번호 마스킹: type="password" -->
          <div class="field" data-field="password">
            <label class="field__label sr-only" for="login-password">비밀번호</label>
            <input
              class="field__input"
              id="login-password"
              name="password"
              type="password"
              placeholder="비밀번호"
              autocomplete="current-password"
              required
            />
            <p class="field__msg"></p>
          </div>

          <!--
            FA103 예외 + 클라이언트 형식/필수 검증 공통 안내
          -->
          <p class="auth-form__error" role="alert" data-server-error=""></p>

          <button class="btn btn--primary btn--block" type="submit">로그인</button>
        </form>

        <!-- FA104 회원가입 이동(A2) -->
        <p class="auth-alt auth-alt--login">
          <a class="btn--link" href="./signup.html">회원가입</a>
        </p>
      </main>
    </div>

    <script src="../../scripts/auth-form.js"></script>
  </body>
</html>
