<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THRIVE · 착륙 점수 확인</title>
    <link rel="stylesheet" href="../../styles/reset.css" />
    <link rel="stylesheet" href="../../styles/variables.css" />
    <link rel="stylesheet" href="../../styles/common.css" />
    <link rel="stylesheet" href="../../styles/home.css" />
    <link rel="stylesheet" href="../../styles/icons.css" />

    <!--
      landing-check 화면 전용 추가 스타일.
      · 기존 공통 CSS(common/home)는 그대로 재사용하고,
        기존과 "다른" 규칙만 여기서 새 클래스로 정의한다. (공유 CSS 미수정 원칙)
      · .score-compare / .factor-card 등은 home.css(비행 후) 정의를 그대로 사용.
    -->
    <style>
      /* 상단 안내문 중 강조(보라 볼드) 부분 */
      .landing-emphasis {
        color: var(--color-primary);
        font-weight: 700;
      }
      .check-title-box {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      /* 예상→현재 비교 카드 가운데 아이콘 교체용(민트 삼각형).
         .score-compare__plane 래퍼가 cyan-500 색상/센터정렬을 이미 제공하므로 크기만 지정 */
      .score-compare__arrow {
        font-size: 22px;
        line-height: 1;
      }
      /* 목표 점수 하단 항목 리스트 (record.css 의 .breakdown-row 와 스타일이 달라 새 클래스로 분리) */
      .landing-breakdown {
        margin-top: var(--space-5, 24px);
      }
      .landing-breakdown-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2, 8px);
        padding: var(--space-4, 16px) 0;
        font-size: var(--fs-body-1, 18px);
        color: var(--color-text);
      }
      .landing-breakdown-row__value {
        font-weight: 700;
        color: var(--color-primary);
      }
      .check-caption {
        font-size: var(--fs-body-3);
        margin-top: var(--space-4);
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <div id="header-mount"></div>
      <main class="app__body">
        <div class="check-title-box">
          <h1 class="text-title-1">컨디션 확인</h1>
          <p class="text-body-1">
            기내에서 수분 보충과 보습을 꾸준히 실천한 덕분에
            <span class="landing-emphasis">예상 점수보다 6점 높은 상태에요.</span>
          </p>

          <!-- ============ 예상 → 현재 비교 카드 ============ -->
          <!--
            main-done.html 의 컨디션 점수 카드(.score-compare)를 활용.
            가운데 비행기 아이콘 → 민트 삼각형(▶)으로 교체.
            왼쪽(예상)은 기본 회색, 오른쪽(현재)은 강조(violet) 처리.
            [Django] 68 → {{ expected_score }} , 74 → {{ current_score }}
          -->
          <div class="score-compare">
            <div class="score-compare__col">
              <div class="score-compare__num" data-expected-score>68</div>
              <div class="score-compare__cap">예상</div>
            </div>
            <div class="score-compare__plane" aria-hidden="true">
              <span class="score-compare__arrow">▶</span>
            </div>
            <div class="score-compare__col">
              <div class="score-compare__num score-compare__num--current" data-current-score>74</div>
              <div class="score-compare__cap score-compare__cap--current">현재</div>
            </div>
          </div>
        </div>

        <!-- ============ 요소별 점수 그래프 (main-done 활용) ============ -->
        <div class="factor-card">
          <div class="factor">
            <div class="factor__head"><span class="factor__label">수면·리듬</span><span class="factor__delta">+ 2점</span></div>
            <div class="bar"><span class="bar__fill" style="width: 62%"></span></div>
          </div>
          <div class="factor">
            <div class="factor__head"><span class="factor__label">순환</span><span class="factor__delta">+ 9점</span></div>
            <div class="bar"><span class="bar__fill" style="width: 90%"></span></div>
          </div>
          <div class="factor">
            <div class="factor__head"><span class="factor__label">수면·리듬</span><span class="factor__delta">− 2점</span></div>
            <div class="bar"><span class="bar__fill" style="width: 78%"></span></div>
          </div>
          <div class="factor">
            <div class="factor__head"><span class="factor__label">피부</span><span class="factor__delta">+ 0점</span></div>
            <div class="bar"><span class="bar__fill" style="width: 84%"></span></div>
          </div>
        </div>

        <!-- ============ 목표 점수 ============ -->
        <section class="home-section">
          <h2 class="home-section__title text-heading-1">목표 점수</h2>

          <!-- [Django] 84 → {{ target_score }} -->
          <p class="score-summary__value"><span class="score-number" data-target-score>84점</span></p>
          <p class="check-caption text-muted">앞으로 3일 간 함께 회복 점수를 올려봐요.</p>

          <div class="landing-breakdown">
            <div class="landing-breakdown-row">
              <span>예정된 여행 기간</span><span class="landing-breakdown-row__value">14일</span>
            </div>
            <div class="landing-breakdown-row">
              <span>남은 회복 시간</span><span class="landing-breakdown-row__value">72시간</span>
            </div>
          </div>
        </section>

        <p class="disclaimer">
          <svg class="disclaimer__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 11v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="8" r="1" fill="currentColor"/></svg>
          <span>이 점수는 여정 정보 기반 참고 지표입니다. 의학적 진단이 아니며 개인 건강 상태에 따라 실제 회복 정도는 다를 수 있습니다.</span>
        </p>

        <button type="button" class="btn btn--primary btn--block" id="routine-start">회복 루틴 실행</button>
      </main>
    </div>
    <script src="../../components/header.js"></script>
    <script>
      document.getElementById("header-mount").append(
        THRIVE.createHeader({
          title: "착륙 점수 확인",
          onClose: function () { window.location.href = "./main-done.html"; },
        })
      );
      document.getElementById("routine-start").addEventListener("click", function () {
        window.location.href = "./main-done.html";
      });
    </script>
  </body>
</html>
