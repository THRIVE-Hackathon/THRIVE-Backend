<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THRIVE</title>
    <link rel="stylesheet" href="./src/styles/reset.css" />
    <link rel="stylesheet" href="./src/styles/variables.css" />
    <link rel="stylesheet" href="./src/styles/common.css" />
    <link rel="stylesheet" href="./src/styles/home.css" />
    <link rel="stylesheet" href="./src/styles/icons.css" />

    <!--
      home.css 에 정의돼 있을 수도, 없을 수도 있는 클래스에 기대지 않도록
      이 화면 전용 스타일을 여기 소량 내장합니다(다른 화면 스타일과 충돌 없음).
    -->
    <style>
      .home-empty {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 48px;
        min-height: calc(100vh - var(--tabbar-height, 96px));
      }
      .home-empty__title-box {
        display: flex;
        gap: var(--space-4);
        flex-direction: column;
      }
      .home-empty__title-icon {
        object-fit: contain;
        width: 48px;
        height: 48px;
        margin-top: 2px;
        color: var(--color-cyan-400);
      }
      .home-empty__title {
        font-size: 26px;
        font-weight: 800;
        text-align: left;
      }
      .home-empty__points {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }
      .home-empty__points li {
        display: flex;
        align-items: flex-start;
        gap: var(--space-3);
        font-size: var(--fs-body-1);
        line-height: 1.5;
        color: var(--color-text, #1a1a1a);
      }
      .home-empty__point-icon {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        margin-top: 2px;
        color: var(--color-accent, #693fcf);
      }
    </style>
  </head>
  <body>
    <!--
      ============================================================
      홈 · 여정 없음 (등록 유도)
      ============================================================
      디자인: main-before-default.pdf 기준
    -->
    <div class="app" id="app">
      <main class="app__body app__body--center">
        <section class="home-empty">
          <div class="home-empty__title-box">
              <span class="home-empty__title-icon" aria-hidden="true">
              <span class="svg-icon svg-icon--flight"></span>
              </span>
            <h1 class="home-empty__title text-title-1">
              <!-- [Django] 유저 → {{ request.user.profile.nickname }} -->
              <span data-user>유저</span>님, 여정을 등록해 주세요.
            </h1>
          </div>

          <ul class="home-empty__points">
            <li>
              <span>1. 예상 컨디션 회복도를 점수로 확인할 수 있어요.</span>
            </li>
            <li>
              <span>2. 어떤 관리가 필요할지 예측할 수 있어요.</span>
            </li>
            <li>
              <span>3. 랜딩의 도움을 받아 장거리 비행 중 컨디션을 최상으로 끌어올릴 수 있어요!</span>
            </li>
          </ul>

          <!-- [Django] href="{% url 'trips:create_step1' %}" -->
          <a class="btn btn--primary btn--block" href="./src/pages/record/trip-register.html">비행 여정 등록</a>
        </section>
      </main>

      <!-- 하단 탭바 (여기서는 상태 고정: 여정이 없으므로 실질적으로 항상 이 페이지가 '메인') -->
      <nav class="app-tabbar" aria-label="메인 내비게이션">
        <a class="app-tabbar__item" href="./src/pages/record/record.html" data-key="record">
          <span class="app-tabbar__icon svg-icon svg-icon--record" aria-hidden="true"></span>
          <span class="app-tabbar__label">기록</span>
        </a>
        <a class="app-tabbar__item is-active" href="./index.html" data-key="home" aria-current="page">
          <span class="app-tabbar__icon svg-icon svg-icon--home" aria-hidden="true"></span>
          <span class="app-tabbar__label">메인</span>
        </a>
        <a class="app-tabbar__item" href="./src/pages/mypage/profile.html" data-key="mypage">
          <span class="app-tabbar__icon svg-icon svg-icon--account" aria-hidden="true"></span>
          <span class="app-tabbar__label">설정</span>
        </a>
      </nav>
    </div>

    <!-- 라우팅 테스트용 임시 스위처 (연동 후 이 두 줄 제거) -->
    <script>window.THRIVE_ROOT = "./index.html";</script>
    <script src="./src/components/state-switcher.js"></script>
  </body>
</html>
